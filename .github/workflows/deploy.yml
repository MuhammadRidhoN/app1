name: Deploy Application 1 to Port 2000

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy via SSH to Web1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting deployment to /var/www/web1.com/public_html"
            
            # 1. Hapus isi folder (sebagai user ubuntu)
            sudo rm -rf /var/www/web1.com/public_html/*
            
            # 2. Salin SEMUA file dari GitHub Actions ke folder web
            # Perintah cp ini bekerja lebih baik saat digabungkan 
            # (Perintah yang dieksekusi oleh appleboy/ssh-action)
            sudo cp -r /home/runner/work/app1/app1/* /var/www/web1.com/public_html/ 
            
            # 3. KOREKSI: Setel kepemilikan REKURSIF ke folder induk
            # Perintah chown ini seharusnya menyelesaikan 403 Forbidden
            sudo chown -R www-data:www-data /var/www/web1.com
            
            echo "Deployment to Port 2000 complete."
