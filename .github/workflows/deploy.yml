name: Deploy Application 1 to Port 2000
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Menggunakan versi terbaru
        with:
          fetch-depth: 0

      - name: Deploy via SSH to Web1 (Port 2000)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }} # Menggunakan nama secret yang Anda minta
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting deployment to /var/www/web1.com/public_html"
            # Hapus dan Salin file (Metode yang aman dan telah teruji)
            sudo rm -rf /var/www/web1.com/public_html/*
            sudo cp -r ./* /var/www/web1.com/public_html/
            # Perbaikan Izin Mutlak untuk menghindari 403 Forbidden
            sudo chown -R www-data:www-data /var/www/web1.com
            # Muat ulang layanan
            sudo systemctl reload nginx
            sudo systemctl restart php8.1-fpm
            echo "Deployment to Port 2000 complete."
