name: Deploy Application 1 to Port 2000
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Menggunakan v4 sebagai versi stabil yang umum
        uses: actions/checkout@v4 
        with:
          fetch-depth: 0

      - name: Deploy via SSH to Web1 (Port 2000)
        # Menggunakan versi action yang Anda tentukan
        uses: appleboy/ssh-action@v0.1.7 
        with:
          # KOREKSI 1: Menggunakan nama Secret yang benar: SSH_HOST
          host: ${{ secrets.SSH_HOST }} 
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting deployment to /var/www/web1.com/public_html"
            
            # KOREKSI 2: Mengganti 'git pull' dengan salin (copy)
            # Menghapus file lama dan menyalin konten repositori saat ini
            sudo rm -rf /var/www/web1.com/public_html/*
            sudo cp -r ./* /var/www/web1.com/public_html/
            
            # KOREKSI 3: Perbaikan Izin (Penting untuk mengatasi 403 Forbidden)
            # Mengatur kepemilikan recursif ke www-data agar Nginx bisa membaca file
            sudo chown -R www-data:www-data /var/www/web1.com
            
            # Muat Ulang Layanan
            sudo systemctl reload nginx
            sudo systemctl restart php8.1-fpm
            
            echo "Deployment to Port 2000 complete."
