name: Deploy Application 1 to Port 2000
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 
        with:
          fetch-depth: 0

      - name: Deploy via SSH to Web1 (Port 2000)
        uses: appleboy/ssh-action@v0.1.7
        with:
          # Pastikan Anda menggunakan nama secret yang benar
          host: ${{ secrets.SERVER_IP }} 
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting rsync deployment to /var/www/web1.com/public_html"
            
            # MENGGUNAKAN RSYNC untuk sinkronisasi file yang andal
            # rsync akan menyalin file dari runner ke server dengan aman
            # Tanda titik (.) di sumber berarti menyalin KONTEN dari folder saat ini
            sudo rsync -av --delete . /var/www/web1.com/public_html/
            
            # Perbaikan Izin Mutlak (Penting untuk mengatasi 403 Forbidden)
            # Mengatur kepemilikan recursif ke www-data
            sudo chown -R www-data:www-data /var/www/web1.com
            
            # Muat ulang layanan Nginx dan PHP-FPM
            sudo systemctl reload nginx
            sudo systemctl restart php8.1-fpm
            
            echo "Deployment to Port 2000 complete."
